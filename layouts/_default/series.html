{{ define "main" }}

  <h1>{{ .Title }}</h1>
  {{ with .Description }}<p class="lede">{{ . }}</p>{{ end }}
</header>
<div class="container">
  {{ partial "series-grid.html" . }}
</div>
{{ end }}
