<!DOCTYPE html>
<html lang="ko" data-theme="light">
<head>
  {{ partial "head.html" . }}
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  {{ partial "header.html" . }}
  <main id="main" class="site-main">
    {{ block "main" . }}{{ end }}
  </main>
  {{ partial "footer.html" . }}
  <script>
    (function () {
      var root = document.documentElement, mq = matchMedia('(prefers-color-scheme: dark)');
      var stored = null; try { stored = localStorage.getItem('theme'); } catch (e) {}
      mq.addEventListener('change', function (e) { if (!stored) root.setAttribute('data-theme', e.matches ? 'dark' : 'light'); });
      document.querySelector('[data-theme-toggle]').addEventListener('click', function () {
        var next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
        root.setAttribute('data-theme', next); stored = next;
        try { localStorage.setItem('theme', next); } catch (e) {}
      });
    })();
  </script>
</body>
</html>
